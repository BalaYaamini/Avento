<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clean Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fafafa; display: flex; min-height: 100vh; }

/* Left Panel - Login */
.login-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px; }
.login-form { width: 100%; max-width: 360px; }
.login-form h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px; }
.login-form p { color: #525252; font-size: 14px; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; color: #a3a3a3; margin-bottom: 8px; }
.form-group input { width: 100%; padding: 12px 16px; background: #161616; border: 1px solid #1c1c1c; border-radius: 8px; color: #fafafa; font-size: 14px; font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; }
.form-group input:focus { border-color: #ef4444; }
.form-group input::placeholder { color: #525252; }
.form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
.remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #525252; cursor: pointer; }
.remember input { accent-color: #ef4444; }
.forgot { font-size: 13px; color: #ef4444; text-decoration: none; cursor: pointer; }
.forgot:hover { color: #dc2626; }
.btn-signin { width: 100%; padding: 12px; background: #ef4444; color: #fafafa; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: 'Inter', sans-serif; }
.btn-signin:hover { background: #dc2626; }
.divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #1c1c1c; }
.divider span { font-size: 12px; color: #525252; }
.btn-google { width: 100%; padding: 12px; background: #161616; color: #fafafa; border: 1px solid #1c1c1c; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-google:hover { border-color: #2a2a2a; background: #1a1a1a; }

/* Right Panel - Branding */
.brand-panel { flex: 1; background: #111111; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px; position: relative; overflow: hidden; }
.brand-panel::before { content: ''; position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(239,68,68,0.08) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); }
.brand-logo { font-size: 72px; font-weight: 700; color: #ef4444; margin-bottom: 48px; position: relative; z-index: 1; letter-spacing: -2px; }
.features { position: relative; z-index: 1; max-width: 320px; }
.feature-item { display: flex; gap: 16px; margin-bottom: 24px; }
.feature-icon { width: 40px; height: 40px; background: rgba(239,68,68,0.1); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.feature-icon svg { width: 20px; height: 20px; color: #ef4444; }
.feature-text h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.feature-text p { font-size: 13px; color: #525252; line-height: 1.5; }
</style>
</head>
<body>
<div class="login-panel">
  <div class="login-form">
    <h1>Welcome back</h1>
    <p>Sign in to your Avento account</p>
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Enter your password">
    </div>
    <div class="form-options">
      <label class="remember"><input type="checkbox"> Remember me</label>
      <a class="forgot">Forgot password?</a>
    </div>
    <button class="btn-signin">Sign In</button>
    <div class="divider"><span>or</span></div>
    <button class="btn-google">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
  </div>
</div>

<div class="brand-panel">
  <div class="brand-logo">A</div>
  <div class="features">
    <div class="feature-item">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
      <div class="feature-text">
        <h3>Event Management</h3>
        <p>Create and manage events with powerful tools</p>
      </div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </div>
      <div class="feature-text">
        <h3>Attendee Tracking</h3>
        <p>Real-time attendance and engagement metrics</p>
      </div>
    </div>
    <div class="feature-item">
      <div class="feature-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div class="feature-text">
        <h3>Analytics Dashboard</h3>
        <p>Insights and reports for better decisions</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
